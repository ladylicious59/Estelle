<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse: Rise of the Arcane — Emberwood Village</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #app { width: 100%; height: 100%; position: relative; }

    /* HUD overlay */
    #hud {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }

    #stamina-bar {
      width: 280px;
      height: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 7px;
      overflow: hidden;
    }

    #stamina-fill {
      width: 100%;
      height: 100%;
      background: #FFD700;
      border-radius: 5px;
      transition: width 0.1s linear, background-color 0.3s;
    }

    #stamina-fill.flashing {
      animation: flash 0.4s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    #state-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* HP bar */
    #hp-bar {
      width: 280px;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      overflow: hidden;
    }

    #hp-fill {
      width: 100%;
      height: 100%;
      background: #44CC44;
      border-radius: 3px;
      transition: width 0.15s ease-out, background-color 0.3s;
    }

    #hp-label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 10px;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      margin-top: 2px;
    }

    /* Damage flash overlay */
    #damage-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      background: rgba(255, 0, 0, 0);
      transition: background 0.05s ease-in;
    }

    #damage-flash.flash-active {
      background: rgba(255, 0, 0, 0.3);
      transition: background 0s;
    }

    /* Combat indicator */
    #combat-indicator {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      color: #FF3333;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 2px 5px #260000;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
    }

    #combat-indicator.combat-active {
      opacity: 1;
      animation: combat-pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes combat-pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.08); }
    }

    /* Controls hint */
    #controls-hint {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="damage-flash"></div>
    <div id="combat-indicator">⚔ COMBAT</div>
    <div id="controls-hint">
      WASD = Move &bull; Shift = Sprint &bull; Space = Jump &bull; Double-tap = Dodge &bull; Scroll = Zoom &bull; LMB = Light Atk &bull; RMB/E = Heavy Atk &bull; Tab = Lock-On
    </div>
    <div id="hud">
      <div id="hp-bar">
        <div id="hp-fill"></div>
      </div>
      <div id="hp-label">100/100</div>
      <div id="stamina-bar">
        <div id="stamina-fill"></div>
      </div>
      <div id="state-label">IDLE</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
