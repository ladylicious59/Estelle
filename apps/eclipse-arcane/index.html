<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse: Rise of the Arcane — Emberwood Village</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #app { width: 100%; height: 100%; position: relative; }

    /* HUD overlay */
    #hud {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }

    #stamina-bar {
      width: 280px;
      height: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 7px;
      overflow: hidden;
    }

    #stamina-fill {
      width: 100%;
      height: 100%;
      background: #FFD700;
      border-radius: 5px;
      transition: width 0.1s linear, background-color 0.3s;
    }

    #stamina-fill.flashing {
      animation: flash 0.4s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    #state-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Controls hint */
    #controls-hint {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="controls-hint">
      WASD = Move &bull; Shift = Sprint &bull; Space = Jump &bull; Alt/Right-click = Dodge &bull; Double-tap = Dodge &bull; Scroll = Zoom
    </div>
    <div id="hud">
      <div id="stamina-bar">
        <div id="stamina-fill"></div>
      </div>
      <div id="state-label">IDLE</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
